
name: Repository Maintenance

# GITHUB_TOKEN 只保留读取权限。
# 实际的 Git 操作和 GitHub API 操作使用 secrets.PERSON_TOKEN。
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      保留天数:
        description: "保留天数（同时应用于 Actions 运行记录和 master 提交）"
        required: true
        default: 30
        type: number

      保留数量:
        description: "保留数量（同时应用于 Actions 运行记录和 master 提交）"
        required: true
        default: 100
        type: number

  # 每天北京时间 03:30（UTC 19:30）
  schedule:
    - cron: '30 19 * * *'

  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/repository-maintenance.yml'

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Update Rules and Cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
      GH_REPO: ${{ github.repository }}

      DEFAULT_KEEP_DAYS: "30"
      DEFAULT_KEEP_COUNT: "100"

    steps:
      # 0. 检查 PERSON_TOKEN
      - name: Validate PERSON_TOKEN
        shell: bash
        env:
          PERSON_TOKEN: ${{ secrets.PERSON_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PERSON_TOKEN" ]; then
            echo "::error::Repository secret PERSON_TOKEN is missing."
            exit 1
          fi

          echo "PERSON_TOKEN is configured."

      # 1. Checkout master
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PERSON_TOKEN }}
          persist-credentials: true

      # 2. Configure Git
      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"

      # 3. Resolve retention settings
      - name: Set maintenance settings
        id: settings
        shell: bash
        env:
          INPUT_KEEP_DAYS: ${{ github.event.inputs['保留天数'] }}
          INPUT_KEEP_COUNT: ${{ github.event.inputs['保留数量'] }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            KEEP_DAYS="${INPUT_KEEP_DAYS:-$DEFAULT_KEEP_DAYS}"
            KEEP_COUNT="${INPUT_KEEP_COUNT:-$DEFAULT_KEEP_COUNT}"
          else
            KEEP_DAYS="$DEFAULT_KEEP_DAYS"
            KEEP_COUNT="$DEFAULT_KEEP_COUNT"
          fi

          if ! [[ "$KEEP_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Retention days must be a positive integer."
            exit 1
          fi

          if ! [[ "$KEEP_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Retention count must be a positive integer."
            exit 1
          fi

          echo "keep_days=$KEEP_DAYS" >> "$GITHUB_OUTPUT"
          echo "keep_count=$KEEP_COUNT" >> "$GITHUB_OUTPUT"

          echo "================================"
          echo "Retention days: $KEEP_DAYS"
          echo "Retention count: $KEEP_COUNT"
          echo "================================"

          {
            echo "## Maintenance Settings"
            echo ""
            echo "- Retention days: **$KEEP_DAYS**"
            echo "- Retention count: **$KEEP_COUNT**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # 4. Remember manual settings in workflow file
      - name: Remember manual settings
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          NEW_KEEP_DAYS: ${{ steps.settings.outputs.keep_days }}
          NEW_KEEP_COUNT: ${{ steps.settings.outputs.keep_count }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_FILE=".github/workflows/repository-maintenance.yml"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(".github/workflows/repository-maintenance.yml")
          content = path.read_text()

          values = [
              ("保留天数", os.environ["NEW_KEEP_DAYS"]),
              ("保留数量", os.environ["NEW_KEEP_COUNT"]),
          ]

          for input_name, value in values:
              pattern = (
                  r'(?m)^('
                  + re.escape("      " + input_name + ":")
                  + r'\n(?:[ \t]+[^\n]*\n)*?[ \t]+default:\s*)\d+'
              )

              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + value,
                  content
              )

              if count != 1:
                  raise SystemExit(
                      f"Could not update input default: {input_name}"
                  )

          env_values = [
              ("DEFAULT_KEEP_DAYS", os.environ["NEW_KEEP_DAYS"]),
              ("DEFAULT_KEEP_COUNT", os.environ["NEW_KEEP_COUNT"]),
          ]

          for name, value in env_values:
              pattern = (
                  r'(?m)^([ \t]*'
                  + re.escape(name)
                  + r':\s*)"[^"]*"'
              )

              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + '"' + value + '"',
                  content
              )

              if count != 1:
                  raise SystemExit(
                      f"Could not update environment default: {name}"
                  )

          path.write_text(content)
          print("Manual settings saved to workflow file.")
          PY

          git add "$WORKFLOW_FILE"

          if git diff --cached --quiet; then
            echo "Settings unchanged. No commit required."
          else
            git commit -m "chore: update maintenance defaults [skip ci]"
            git push origin HEAD:master
            echo "New defaults saved to master."
          fi

      # 5. Decide whether maintenance should run
      - name: Check maintenance trigger
        id: gate
        env:
          PUSH_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          PUSH_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_RUN=true

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # 忽略本 Workflow 自己推送的维护提交，防止递归执行。
            if [ "$PUSH_AUTHOR_NAME" = "GitHub Actions Bot" ] ||
               [ "$PUSH_AUTHOR_EMAIL" = "github-actions[bot]@users.noreply.github.com" ]; then
              SHOULD_RUN=false
              echo "Bot commit detected. Skip maintenance."
            else
              echo "Repository push detected. Run maintenance."
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger. Run maintenance."
          else
            echo "Scheduled trigger. Run maintenance."
          fi

          echo "run_maintenance=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      # 6. Delete old Workflow Runs
      - name: Delete old Workflow Runs
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.keep_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.keep_count }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          echo "Workflow Runs retention: $KEEP_DAYS days"
          echo "Workflow Runs maximum count: $KEEP_COUNT"

          gh api --paginate \
            "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' \
            > /tmp/actions-runs.tsv

          # 按创建时间从新到旧排序。
          sort -t $'\t' -k2,2r /tmp/actions-runs.tsv \
            -o /tmp/actions-runs.tsv

          DELETED=0
          KEPT=0

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            [ -z "${RUN_ID:-}" ] && continue

            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "KEEP current run: $RUN_ID"
              continue
            fi

            CREATED=$(date -u -d "$CREATED_AT" +%s)

            # 先按保留天数筛选，再按保留数量限制。
            if [ "$CREATED" -lt "$CUTOFF" ]; then
              SHOULD_DELETE=true
            elif [ "$KEPT" -lt "$KEEP_COUNT" ]; then
              SHOULD_DELETE=false
              KEPT=$((KEPT + 1))
            else
              SHOULD_DELETE=true
            fi

            if [ "$SHOULD_DELETE" = "true" ]; then
              echo "DELETE: $RUN_ID ($CREATED_AT)"

              gh api \
                --method DELETE \
                "repos/$GH_REPO/actions/runs/$RUN_ID"

              DELETED=$((DELETED + 1))
            else
              echo "KEEP: $RUN_ID ($CREATED_AT)"
            fi
          done < /tmp/actions-runs.tsv

          echo "Deleted: $DELETED"
          echo "Kept: $KEPT"

          {
            echo "## Workflow Runs Cleanup"
            echo ""
            echo "- Retention days: $KEEP_DAYS"
            echo "- Maximum retained runs: $KEEP_COUNT"
            echo "- Deleted: $DELETED"
            echo "- Kept: $KEPT"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # 7. Run automatic rule update
      - name: Run start-ci.sh
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash ./scripts/start-ci.sh

      # 8. Build ad branch snapshot
      - name: Build ad branch snapshot
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_FILES=(
            "ad.yaml"
            "ad-easylist.txt"
            "ad-smartdns.conf"
            "ad.list"
            "ad.conf"
          )

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo "Copying ad files..."

          for FILE in "${KEEP_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              mkdir -p "$TMP_DIR/$(dirname "$FILE")"
              cp "$FILE" "$TMP_DIR/$FILE"
              echo "KEEP: $FILE"
            else
              echo "WARNING: File not found: $FILE"
            fi
          done

          TEMP_BRANCH="build-ad-${GITHUB_RUN_ID}"

          git checkout --orphan "$TEMP_BRANCH"

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          cp -a "$TMP_DIR/." .

          find . -type f -name "*.md5" -delete

          git add -A

          git commit --allow-empty \
            -m "update: $(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")"

          echo "ad snapshot created."

      # 9. Publish ad branch
      # ad 是发布分支，只更新最新快照，不参与 master 历史清理。
      - name: Push ad branch
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git push --force origin HEAD:refs/heads/ad

          echo "ad release branch updated successfully."

      # 10. Prepare master history cleanup
      - name: Prepare master history cleanup
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        id: history
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.keep_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.keep_count }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Master history retention: $KEEP_DAYS days"
          echo "Master history maximum count: $KEEP_COUNT"

          # 明确只获取和处理 master。
          # 不获取、不遍历、不修改 ad 分支。
          git fetch origin master
          git checkout --detach refs/remotes/origin/master

          OLD_HEAD=$(git rev-parse HEAD)
          OLD_TREE=$(git rev-parse "$OLD_HEAD^{tree}")
          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          mapfile -t FIRST_PARENT_COMMITS < <(
            git rev-list --reverse --first-parent "$OLD_HEAD"
          )

          ELIGIBLE=()

          # 第一步：按保留天数筛选 master 第一父链提交。
          for COMMIT in "${FIRST_PARENT_COMMITS[@]}"; do
            COMMIT_TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$COMMIT_TIME" -ge "$CUTOFF" ]; then
              ELIGIBLE+=("$COMMIT")
            fi
          done

          FIRST_KEEP=""

          # 第二步：在符合日期条件的提交中，只保留最近 KEEP_COUNT 个。
          if [ "${#ELIGIBLE[@]}" -gt 0 ]; then
            ELIGIBLE_COUNT="${#ELIGIBLE[@]}"

            if [ "$ELIGIBLE_COUNT" -gt "$KEEP_COUNT" ]; then
              KEEP_INDEX=$((ELIGIBLE_COUNT - KEEP_COUNT))
            else
              KEEP_INDEX=0
            fi

            FIRST_KEEP="${ELIGIBLE[$KEEP_INDEX]}"
          fi

          echo "Master first-parent commits: ${#FIRST_PARENT_COMMITS[@]}"
          echo "Eligible commits by date: ${#ELIGIBLE[@]}"

          # 第一个提交已经是保留起点，无须重写。
          if [ -n "$FIRST_KEEP" ] &&
             [ "$FIRST_KEEP" = "${FIRST_PARENT_COMMITS[0]}" ]; then

            echo "No old master history to clean."

            echo "new_head=" >> "$GITHUB_OUTPUT"
            echo "old_head=$OLD_HEAD" >> "$GITHUB_OUTPUT"

            {
              echo "## Master Commit Cleanup"
              echo ""
              echo "- Retention days: $KEEP_DAYS"
              echo "- Maximum retained commits: $KEEP_COUNT"
              echo "- No history rewrite required."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          TEMP_BRANCH="cleanup-rewrite-${GITHUB_RUN_ID}"

          git branch -f "$TEMP_BRANCH" "$OLD_HEAD"

          if [ -n "$FIRST_KEEP" ]; then
            echo "First retained master commit:"
            git show -s --format="%h %ad %s" --date=short "$FIRST_KEEP"

            # 使用第一个保留提交的第一父提交文件树作为新根。
            # 然后从该父提交之后开始重放，确保 FIRST_KEEP 本身也被重放。
            FIRST_PARENT=$(git rev-parse "$FIRST_KEEP^1")
            ROOT_TREE=$(git rev-parse "$FIRST_PARENT^{tree}")

            NEW_ROOT=$(
              printf '%s\n' "Initial history snapshot" \
                | git commit-tree "$ROOT_TREE"
            )

            echo "New root: $NEW_ROOT"

            git rebase \
              --rebase-merges \
              --onto "$NEW_ROOT" \
              "$FIRST_PARENT" \
              "$TEMP_BRANCH"
          else
            echo "No commits meet the retention date."
            echo "Keeping the current master file snapshot only."

            NEW_ROOT=$(
              printf '%s\n' "Initial history snapshot" \
                | git commit-tree "$OLD_TREE"
            )

            git branch -f "$TEMP_BRANCH" "$NEW_ROOT"
          fi

          NEW_HEAD=$(git rev-parse "$TEMP_BRANCH")
          NEW_TREE=$(git rev-parse "$NEW_HEAD^{tree}")

          # 必须确保重写前后文件树对象完全相同。
          if [ "$OLD_TREE" != "$NEW_TREE" ]; then
            echo "::error::Master file tree changed during history rewrite."
            echo "Old tree: $OLD_TREE"
            echo "New tree: $NEW_TREE"
            exit 1
          fi

          echo "File tree verification passed."

          OLD_COUNT=$(git rev-list --count --first-parent "$OLD_HEAD")
          NEW_COUNT=$(git rev-list --count --first-parent "$NEW_HEAD")

          echo "Old first-parent commits: $OLD_COUNT"
          echo "New first-parent commits: $NEW_COUNT"

          echo "old_head=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          echo "new_head=$NEW_HEAD" >> "$GITHUB_OUTPUT"

          {
            echo "## Master Commit Cleanup"
            echo ""
            echo "- Retention days: $KEEP_DAYS"
            echo "- Maximum retained commits: $KEEP_COUNT"
            echo "- Old first-parent commits: $OLD_COUNT"
            echo "- New first-parent commits: $NEW_COUNT"
            echo "- File tree verification: passed"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # 11. Push cleaned master history
      - name: Push cleaned master history
        if: >-
          ${{
            steps.gate.outputs.run_maintenance == 'true' &&
            steps.history.outputs.new_head != ''
          }}
        env:
          OLD_HEAD: ${{ steps.history.outputs.old_head }}
          NEW_HEAD: ${{ steps.history.outputs.new_head }}
        shell: bash
        run: |
          set -euo pipefail

          # 推送前再次验证文件树。
          OLD_TREE=$(git rev-parse "$OLD_HEAD^{tree}")
          NEW_TREE=$(git rev-parse "$NEW_HEAD^{tree}")

          if [ "$OLD_TREE" != "$NEW_TREE" ]; then
            echo "::error::File tree verification failed before push."
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/master:$OLD_HEAD" \
            origin \
            "$NEW_HEAD:refs/heads/master"

          echo "Master history updated successfully."

      # 12. Final summary
      - name: Maintenance summary
        if: always()
        shell: bash
        run: |
          echo "================================"
          echo "Repository Maintenance"
          echo "================================"

          {
            echo "## Maintenance Result"
            echo ""
            echo "- Retention days: ${{ steps.settings.outputs.keep_days }}"
            echo "- Retention count: ${{ steps.settings.outputs.keep_count }}"
            echo "- Maintenance executed: ${{ steps.gate.outputs.run_maintenance }}"
            echo "- ad branch: release snapshot only; excluded from history cleanup"
            echo "- master branch: retention cleanup target"
          } >> "$GITHUB_STEP_SUMMARY"
