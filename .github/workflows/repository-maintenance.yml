
name: 仓库维护

# GITHUB_TOKEN 只保留读取权限。
# Git 操作和 GitHub API 操作使用 secrets.PERSON_TOKEN。
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      保留天数:
        description: "保留天数（同时应用于 Actions 运行记录和 master 提交）"
        required: true
        default: 7
        type: number

      保留数量:
        description: "保留数量（同时应用于 Actions 运行记录和 master 提交）"
        required: true
        default: 30
        type: number

  schedule:
    - cron: 30 */3 * * *

  # master 分支发生普通推送时执行。
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/repository-maintenance.yml'

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: 更新规则与清理历史
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.PERSON_TOKEN }}
      GH_REPO: ${{ github.repository }}

      DEFAULT_KEEP_DAYS: "7"
      DEFAULT_KEEP_COUNT: "30"

    steps:
      # 0. 检查 PERSON_TOKEN
      - name: 检查 PERSON_TOKEN
        shell: bash
        env:
          PERSON_TOKEN: ${{ secrets.PERSON_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PERSON_TOKEN" ]; then
            echo "::error::仓库密钥 PERSON_TOKEN 尚未配置。"
            exit 1
          fi

          echo "PERSON_TOKEN 已配置。"

      # 1. 检出 master
      - name: 检出仓库代码
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PERSON_TOKEN }}
          persist-credentials: true

      # 2. 配置 Git
      - name: 配置 Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"

          echo "Git 用户信息配置完成。"

      # 3. 读取保留设置
      - name: 设置保留规则
        id: settings
        shell: bash
        env:
          INPUT_KEEP_DAYS: ${{ github.event.inputs['保留天数'] }}
          INPUT_KEEP_COUNT: ${{ github.event.inputs['保留数量'] }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            KEEP_DAYS="${INPUT_KEEP_DAYS:-$DEFAULT_KEEP_DAYS}"
            KEEP_COUNT="${INPUT_KEEP_COUNT:-$DEFAULT_KEEP_COUNT}"
          else
            KEEP_DAYS="$DEFAULT_KEEP_DAYS"
            KEEP_COUNT="$DEFAULT_KEEP_COUNT"
          fi

          if ! [[ "$KEEP_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::保留天数必须是大于零的整数。"
            exit 1
          fi

          if ! [[ "$KEEP_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::保留数量必须是大于零的整数。"
            exit 1
          fi

          echo "keep_days=$KEEP_DAYS" >> "$GITHUB_OUTPUT"
          echo "keep_count=$KEEP_COUNT" >> "$GITHUB_OUTPUT"

          echo "================================"
          echo "保留天数：$KEEP_DAYS 天"
          echo "保留数量：$KEEP_COUNT 条"
          echo "================================"

          {
            echo "## 维护设置"
            echo ""
            echo "- 保留天数：**$KEEP_DAYS 天**"
            echo "- 保留数量：**$KEEP_COUNT 条**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # 4. 将手动设置保存为下一次默认值
      - name: 保存手动设置
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          NEW_KEEP_DAYS: ${{ steps.settings.outputs.keep_days }}
          NEW_KEEP_COUNT: ${{ steps.settings.outputs.keep_count }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_FILE=".github/workflows/repository-maintenance.yml"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(".github/workflows/repository-maintenance.yml")
          content = path.read_text()

          values = [
              ("保留天数", os.environ["NEW_KEEP_DAYS"]),
              ("保留数量", os.environ["NEW_KEEP_COUNT"]),
          ]

          # 更新 workflow_dispatch 中的两个默认值。
          for input_name, value in values:
              pattern = (
                  r'(?m)^('
                  + re.escape("      " + input_name + ":")
                  + r'\n(?:[ \t]+[^\n]*\n)*?[ \t]+default:\s*)\d+'
              )

              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + value,
                  content
              )

              if count != 1:
                  raise SystemExit(
                      f"无法更新手动输入默认值：{input_name}"
                  )

          # 同步更新定时任务使用的环境变量默认值。
          env_values = [
              ("DEFAULT_KEEP_DAYS", os.environ["NEW_KEEP_DAYS"]),
              ("DEFAULT_KEEP_COUNT", os.environ["NEW_KEEP_COUNT"]),
          ]

          for name, value in env_values:
              pattern = (
                  r'(?m)^([ \t]*'
                  + re.escape(name)
                  + r':\s*)"[^"]*"'
              )

              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + '"' + value + '"',
                  content
              )

              if count != 1:
                  raise SystemExit(
                      f"无法更新环境变量默认值：{name}"
                  )

          path.write_text(content)
          print("手动设置已保存。")
          PY

          git add "$WORKFLOW_FILE"

          if git diff --cached --quiet; then
            echo "设置没有变化，无须提交。"
          else
            git commit -m "维护：更新保留规则 [skip ci]"
            git push origin HEAD:master
            echo "新的默认设置已保存到 master。"
          fi

      # 5. 判断是否执行维护
      - name: 检查维护触发条件
        id: gate
        env:
          PUSH_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          PUSH_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_RUN=true

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # 忽略本工作流自己推送的维护提交，避免重复触发。
            if [ "$PUSH_AUTHOR_NAME" = "GitHub Actions Bot" ] ||
               [ "$PUSH_AUTHOR_EMAIL" = "github-actions[bot]@users.noreply.github.com" ]; then
              SHOULD_RUN=false
              echo "检测到机器人提交，跳过本次维护。"
            else
              echo "检测到仓库推送，开始执行维护。"
            fi

          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "检测到手动触发，立即执行维护。"

          else
            echo "检测到定时触发，开始执行维护。"
          fi

          echo "run_maintenance=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      # 6. 清理 Actions 运行记录
      - name: 清理 Actions 运行记录
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.keep_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.keep_count }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          echo "运行记录保留天数：$KEEP_DAYS 天"
          echo "运行记录保留数量：$KEEP_COUNT 条"

          gh api --paginate \
            "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' \
            > /tmp/actions-runs.tsv

          # 按创建时间从新到旧排序。
          sort -t $'\t' -k2,2r /tmp/actions-runs.tsv \
            -o /tmp/actions-runs.tsv

          DELETED=0
          KEPT=0

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            [ -z "${RUN_ID:-}" ] && continue

            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "保留当前运行记录：$RUN_ID"
              continue
            fi

            CREATED=$(date -u -d "$CREATED_AT" +%s)

            # 先按保留天数筛选，再按保留数量限制。
            if [ "$CREATED" -lt "$CUTOFF" ]; then
              SHOULD_DELETE=true
            elif [ "$KEPT" -lt "$KEEP_COUNT" ]; then
              SHOULD_DELETE=false
              KEPT=$((KEPT + 1))
            else
              SHOULD_DELETE=true
            fi

            if [ "$SHOULD_DELETE" = "true" ]; then
              echo "删除运行记录：$RUN_ID（$CREATED_AT）"

              gh api \
                --method DELETE \
                "repos/$GH_REPO/actions/runs/$RUN_ID"

              DELETED=$((DELETED + 1))
            else
              echo "保留运行记录：$RUN_ID（$CREATED_AT）"
            fi
          done < /tmp/actions-runs.tsv

          echo "已删除：$DELETED 条"
          echo "已保留：$KEPT 条"

          {
            echo "## Actions 运行记录清理"
            echo ""
            echo "- 保留天数：$KEEP_DAYS 天"
            echo "- 最多保留数量：$KEEP_COUNT 条"
            echo "- 已删除：$DELETED 条"
            echo "- 已保留：$KEPT 条"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # 7. 更新广告规则
      - name: 执行广告规则更新脚本
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "开始执行广告规则更新脚本。"
          /bin/bash ./scripts/start-ci.sh
          echo "广告规则更新完成。"

      # 8. 构建 ad 发布分支快照
      - name: 构建 ad 发布分支快照
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_FILES=(
            "ad.yaml"
            "ad-easylist.txt"
            "ad-smartdns.conf"
            "ad.list"
            "ad.conf"
          )

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo "开始复制广告发布文件。"

          for FILE in "${KEEP_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              mkdir -p "$TMP_DIR/$(dirname "$FILE")"
              cp "$FILE" "$TMP_DIR/$FILE"
              echo "保留文件：$FILE"
            else
              echo "::warning::未找到文件：$FILE"
            fi
          done

          TEMP_BRANCH="build-ad-${GITHUB_RUN_ID}"

          git checkout --orphan "$TEMP_BRANCH"

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          cp -a "$TMP_DIR/." .

          find . -type f -name "*.md5" -delete

          git add -A

          git commit --allow-empty \
            -m "更新广告规则：$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")"

          echo "ad 发布快照构建完成。"

      # 9. 发布 ad 分支
      # ad 是发布分支，只更新最新快照，不参与历史清理。
      - name: 发布 ad 分支
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git push --force origin HEAD:refs/heads/ad

          echo "ad 发布分支已成功更新。"

      # 10. 清理 master 提交历史
      - name: 清理 master 提交历史
        if: ${{ steps.gate.outputs.run_maintenance == 'true' }}
        id: history
        env:
          KEEP_DAYS: ${{ steps.settings.outputs.keep_days }}
          KEEP_COUNT: ${{ steps.settings.outputs.keep_count }}
        shell: bash
        run: |
          set -euo pipefail

          echo "master 提交保留天数：$KEEP_DAYS 天"
          echo "master 提交保留数量：$KEEP_COUNT 条"

          # 只获取 master，不处理 ad 发布分支。
          git fetch origin master
          git checkout --detach refs/remotes/origin/master

          OLD_HEAD=$(git rev-parse HEAD)
          OLD_TREE=$(git rev-parse "$OLD_HEAD^{tree}")
          CUTOFF=$(date -u -d "$KEEP_DAYS days ago" +%s)

          mapfile -t FIRST_PARENT_COMMITS < <(
            git rev-list --reverse --first-parent "$OLD_HEAD"
          )

          ELIGIBLE=()

          # 第一步：按保留天数筛选 master 第一父链提交。
          for COMMIT in "${FIRST_PARENT_COMMITS[@]}"; do
            COMMIT_TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$COMMIT_TIME" -ge "$CUTOFF" ]; then
              ELIGIBLE+=("$COMMIT")
            fi
          done

          FIRST_KEEP=""

          # 第二步：在符合日期条件的提交中保留最近 KEEP_COUNT 条。
          if [ "${#ELIGIBLE[@]}" -gt 0 ]; then
            ELIGIBLE_COUNT="${#ELIGIBLE[@]}"

            if [ "$ELIGIBLE_COUNT" -gt "$KEEP_COUNT" ]; then
              KEEP_INDEX=$((ELIGIBLE_COUNT - KEEP_COUNT))
            else
              KEEP_INDEX=0
            fi

            FIRST_KEEP="${ELIGIBLE[$KEEP_INDEX]}"
          fi

          echo "master 第一父链提交总数：${#FIRST_PARENT_COMMITS[@]}"
          echo "符合日期条件的提交数：${#ELIGIBLE[@]}"

          # 如果第一条主线提交已经符合保留条件，则无需重写。
          if [ -n "$FIRST_KEEP" ] &&
             [ "$FIRST_KEEP" = "${FIRST_PARENT_COMMITS[0]}" ]; then

            echo "master 历史无需清理。"

            echo "new_head=" >> "$GITHUB_OUTPUT"
            echo "old_head=$OLD_HEAD" >> "$GITHUB_OUTPUT"

            {
              echo "## master 提交历史清理"
              echo ""
              echo "- 保留天数：$KEEP_DAYS 天"
              echo "- 保留数量：$KEEP_COUNT 条"
              echo "- 无须重写提交历史。"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          TEMP_BRANCH="cleanup-rewrite-${GITHUB_RUN_ID}"

          git branch -f "$TEMP_BRANCH" "$OLD_HEAD"

          if [ -n "$FIRST_KEEP" ]; then
            echo "第一条保留提交："
            git show -s --format="%h %ad %s" --date=short "$FIRST_KEEP"

            # 取第一条保留提交的第一父提交。
            FIRST_PARENT=$(git rev-parse "$FIRST_KEEP^1")

            # 新根提交使用第一条保留提交的父提交文件树。
            ROOT_TREE=$(git rev-parse "$FIRST_PARENT^{tree}")

            NEW_ROOT=$(
              printf '%s\n' "初始历史快照" \
                | git commit-tree "$ROOT_TREE"
            )

            echo "新历史根提交：$NEW_ROOT"

            # 从第一条保留提交的父提交之后开始重放。
            git rebase \
              --rebase-merges \
              --onto "$NEW_ROOT" \
              "$FIRST_PARENT" \
              "$TEMP_BRANCH"

          else
            echo "没有提交符合保留日期条件。"
            echo "仅保留当前 master 文件快照。"

            NEW_ROOT=$(
              printf '%s\n' "初始历史快照" \
                | git commit-tree "$OLD_TREE"
            )

            git branch -f "$TEMP_BRANCH" "$NEW_ROOT"
          fi

          NEW_HEAD=$(git rev-parse "$TEMP_BRANCH")
          NEW_TREE=$(git rev-parse "$NEW_HEAD^{tree}")

          # 验证重写前后完整文件树完全一致。
          if [ "$OLD_TREE" != "$NEW_TREE" ]; then
            echo "::error::master 历史重写后文件树发生变化，停止推送。"
            echo "原文件树：$OLD_TREE"
            echo "新文件树：$NEW_TREE"
            exit 1
          fi

          echo "文件树验证通过。"

          OLD_COUNT=$(git rev-list --count --first-parent "$OLD_HEAD")
          NEW_COUNT=$(git rev-list --count --first-parent "$NEW_HEAD")

          echo "重写前主线提交数：$OLD_COUNT"
          echo "重写后主线提交数：$NEW_COUNT"

          echo "old_head=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          echo "new_head=$NEW_HEAD" >> "$GITHUB_OUTPUT"

          {
            echo "## master 提交历史清理"
            echo ""
            echo "- 保留天数：$KEEP_DAYS 天"
            echo "- 保留数量：$KEEP_COUNT 条"
            echo "- 重写前主线提交数：$OLD_COUNT"
            echo "- 重写后主线提交数：$NEW_COUNT"
            echo "- 完整文件树验证：通过"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # 11. 推送清理后的 master 历史
      - name: 推送清理后的 master 历史
        if: ${{ steps.gate.outputs.run_maintenance == 'true' && steps.history.outputs.new_head != '' }}
        env:
          OLD_HEAD: ${{ steps.history.outputs.old_head }}
          NEW_HEAD: ${{ steps.history.outputs.new_head }}
        shell: bash
        run: |
          set -euo pipefail

          # 推送前再次验证文件树。
          OLD_TREE=$(git rev-parse "$OLD_HEAD^{tree}")
          NEW_TREE=$(git rev-parse "$NEW_HEAD^{tree}")

          if [ "$OLD_TREE" != "$NEW_TREE" ]; then
            echo "::error::推送前文件树验证失败，拒绝推送。"
            exit 1
          fi

          echo "推送前文件树验证通过。"

          git push \
            --force-with-lease="refs/heads/master:$OLD_HEAD" \
            origin \
            "$NEW_HEAD:refs/heads/master"

          echo "master 提交历史已成功更新。"

          {
            echo "## master 历史推送结果"
            echo ""
            echo "- 原提交：$OLD_HEAD"
            echo "- 新提交：$NEW_HEAD"
            echo "- 文件树验证：通过"
            echo "- 推送结果：成功"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # 12. 输出维护结果
      - name: 输出维护结果
        if: always()
        shell: bash
        run: |
          echo "================================"
          echo "仓库维护执行结果"
          echo "================================"

          {
            echo "## 仓库维护结果"
            echo ""
            echo "- 保留天数：${{ steps.settings.outputs.keep_days }} 天"
            echo "- 保留数量：${{ steps.settings.outputs.keep_count }} 条"
            echo "- 是否执行维护：${{ steps.gate.outputs.run_maintenance }}"
            echo "- ad 分支：仅发布最新广告文件快照，不参与历史清理"
            echo "- master 分支：按保留规则清理提交历史"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
