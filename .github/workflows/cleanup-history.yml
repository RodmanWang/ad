name: Cleanup ad git history

on:
  workflow_dispatch:

  schedule:
    # 每月1号 UTC 02:00 执行
    - cron: '0 2 1 * *'

concurrency:
  group: cleanup-ad-git-history
  cancel-in-progress: true

jobs:
  cleanup:
    name: Keep recent git history
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout master history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y git-filter-repo

      - name: Cleanup old commits
        run: |
          set -e

          KEEP_DAYS=180

          echo "Keep days: $KEEP_DAYS"

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Cutoff: $CUTOFF"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"

          git filter-repo \
            --force \
            --commit-callback "if int(commit.author_date.split()[0]) < $CUTOFF: commit.skip()"

      - name: Cleanup repository
        run: |
          git reflog expire --expire=now --all
          git gc --prune=now

      - name: Check result
        run: |
          echo "Current commits:"
          git log --oneline -10

          echo ""

          echo "Repository size:"
          du -sh .git

      - name: Push cleaned history
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PERSON_TOKEN }}
          branch: master
          force: true
